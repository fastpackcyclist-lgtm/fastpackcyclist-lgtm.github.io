title: NARVI
description: Applied AI, agent orchestration, and notes from building A.R.C.H.O.N. and PRISM.
author: Akeim Joseph
theme: minima
markdown: kramdown
plugins:
  - jekyll-feed

# GoatCounter site code (the part before ".goatcounter.com" in your dashboard
# URL). Leave blank to keep analytics off — head-custom.html only emits the
# script tag once this is set.
goatcounter_code: ""

minima:
  social_links:
    - { platform: github, user_url: "https://github.com/fastpackcyclist-lgtm" }
    - { platform: linkedin, user_url: "https://linkedin.com/in/akeim-joseph-994963276" }
  nav_pages:
    - about.md
    - research/index.md
    - projects/index.md
    - journal/index.md
    - notes/index.md
    - news/index.md
    - cv/index.md

collections:
  projects:
    output: true
    permalink: /projects/:path/
  journal:
    output: true
    permalink: /journal/:path/
  notes:
    output: true
    permalink: /notes/:path/
  research:
    output: true
    permalink: /research/:path/
