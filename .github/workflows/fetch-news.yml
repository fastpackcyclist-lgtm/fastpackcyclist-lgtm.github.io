name: Fetch News

on:
  schedule:
    # Once daily at 13:00 UTC. Hacker News + arXiv, no API key required.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/fetch-news.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/news.yml; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/news.yml
          git commit -m "Update news feed [skip ci]"
          git push
