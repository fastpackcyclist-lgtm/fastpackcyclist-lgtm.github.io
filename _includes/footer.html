<footer class="site-footer h-card">
  <data class="u-url" value="{{ '/' | relative_url }}"></data>

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col">
        <ul class="contact-list">
          <li class="p-name">{{ site.title | escape }}</li>
          {%- if site.author %}
          <li>{{ site.author | escape }}</li>
          {%- endif %}
        </ul>
      </div>
      <div class="footer-col">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>

    <div class="social-links">
      {%- include social.html -%}
    </div>

    <div class="footer-meta">
      <p>N.A.R.V.I. — Nexus Applied Research &amp; Verified Intelligence</p>
      <p>Site founded September 15, 2026</p>
    </div>

  </div>

</footer>
